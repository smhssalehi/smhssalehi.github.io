<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ site.title | escape }}{% if page.title %} — {{ page.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/images/initials.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead">
    <nav class="navigation" aria-label="Main navigation">
      <ul>{% for link in site.data.navigation.main %}
        <li><a href="{{ link.url | relative_url }}"{% if link.new_tab %} target="_blank" rel="noopener" aria-label="{{ link.title }} (PDF, opens in a new tab)"{% endif %}{% if page.url == link.url %} aria-current="page"{% endif %}><span>{{ link.title }}</span></a></li>
      {% endfor %}</ul>
    </nav>
  </header>
  <div class="site-grid">
    {% include academic-sidebar.html %}
    <main id="main" tabindex="-1">{{ content }}</main>
  </div>
</body>
</html>
